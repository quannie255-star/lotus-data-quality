name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Public-surface residue check
        run: |
          ! git grep -nE "求职|面试|简历|投递简历|招聘|考官|AI 助手|workbuddy|zcode|codebuddy" \
              -- . ':!.github/**' ':!data/**' ':!docs/traces/**'

      - name: Placeholder README check
        run: |
          ! grep -rn "待补充一句话说明" --include="README.md" . \
              --exclude-dir=.venv --exclude-dir=.git
